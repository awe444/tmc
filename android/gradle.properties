org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g
org.gradle.parallel=true
org.gradle.caching=true

android.useAndroidX=false
android.nonTransitiveRClass=true

# Viewport size for the native build, mirroring TMC_VIEW_W / TMC_VIEW_H on the
# desktop side. 320x240 is the expanded viewport this milestone is about and
# what the maintainer plays; it is the default here because a 240x160 Android
# build is not what anyone wants to test. For the GBA-native size -- the one
# the regression gate covers -- set:
#     tmc.viewWidth=240
#     tmc.viewHeight=160
# Changing these forces a native rebuild -- they are compile-time defines.
tmc.viewWidth=320
tmc.viewHeight=240

# Path to the ROM the assets are extracted from at build time. Relative paths
# resolve against the repository root. The ROM is baked into the APK because
# the engine treats a missing one as fatal (port_rom.c) even when every
# extracted asset is present.
tmc.baserom=baserom.gba
